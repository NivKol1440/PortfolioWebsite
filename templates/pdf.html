<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF — KolothGroup</title>
    <meta name="description" content="View the PDF document in your browser.">
    <link rel="icon" type="image/x-icon" href="{{ url_for('favicon') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='loading.js') }}" defer></script>
</head>
<body>
    {% include 'loading_screen.html' %}

    <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ url_for('home') }}">Portfolio</a>
        <a href="{{ url_for('shop') }}">Shop</a>
        <a href="{{ url_for('pdf') }}" aria-current="page">PDF</a>
    </nav>

    <main class="pdf-page">
        <div class="pdf-heading">
            <h1>PDF</h1>
            <a href="{{ url_for('pdf_file') }}" target="_blank" rel="noopener noreferrer">Open in new tab</a>
        </div>
        <iframe class="pdf-viewer" src="{{ url_for('pdf_file') }}" title="PDF document"></iframe>
    </main>
</body>
</html>
